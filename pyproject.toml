[project]
name = "loan-analyst"
version = "0.1.0"
description = "Credit-risk analyst assistant over SEC 10-K filings, with every number verified and cited"
readme = "README.md"
authors = [
    { name = "Ördög Tamás", email = "ordog.tamas1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.16.1",
]

[project.scripts]
loan-analyst = "loan_analyst:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
markers = ["integration: needs a running Postgres"]
